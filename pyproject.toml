[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-compliance-local"
version = "0.1.0"
description = "Verificador local de cumplimiento documental: checklist de requisitos, evidencia citada y brechas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Angel Salazar" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pytest>=8.0",
]

[project.scripts]
doc-compliance = "doc_compliance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_compliance = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
