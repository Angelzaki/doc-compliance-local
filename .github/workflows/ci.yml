name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Pruebas
        run: pytest -q
      - name: Experimento docs_ok vs docs_gap
        run: python -m doc_compliance compare --no-store --out results

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t doc-compliance-local:ci .
      - name: Verificar contenedor en el puerto 8022
        run: |
          docker run -d --name dc -p 8022:8022 doc-compliance-local:ci
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8022/api/health && exit 0
            sleep 1
          done
          docker logs dc
          exit 1
